<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | M.R GAME ZONE</title><link rel="stylesheet" href="admin.css"></head><body><header class="admin-header"><b>M.R GAME ZONE <span>ADMIN</span></b><button id="logout" class="btn small">Logout</button></header><main class="admin-main"><h1>Dashboard</h1><div class="stats"><div class="panel"><small>Total Orders</small><strong id="order-count">0</strong></div><div class="panel"><small>Pending Orders</small><strong id="pending-count">0</strong></div><div class="panel"><small>Products</small><strong id="product-count">0</strong></div></div><section class="panel"><h2>অর্ডার ম্যানেজমেন্ট</h2><div class="table-wrap"><table><thead><tr><th>Order ID</th><th>Customer</th><th>Phone</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders-table"></tbody></table></div></section><section class="panel"><h2>প্রোডাক্ট তালিকা (ডেমো)</h2><div id="admin-products"></div><p class="hint">এই ডেমোতে প্রোডাক্ট এডিট/ডিলিট নেই। লাইভ ব্যবহারের জন্য ডেটাবেস ও নিরাপদ Admin API যুক্ত করতে হবে।</p></section></main><script src="../products.js"></script><script src="admin.js"></script></body></html>
